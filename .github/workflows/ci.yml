name: ci

# This repo is ~90% Markdown, SVG and campaign copy — there is nothing to build and
# nothing to type-check. What it does have is two shell scripts (one of them the
# public-repo leak gate) and one executable that every future campaign folder is
# generated by. Those are what CI covers. There are deliberately no tests over content.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job here only reads the tree.
permissions:
  contents: read

jobs:
  lint-shell:
    name: Shell lint (shellcheck + bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/leak-gate.sh is the only thing standing between an applicant's name and a
      # public repo. It had no lint of any kind. Both tracked scripts are already clean at
      # --severity=warning, so this starts green and stays a gate rather than a backlog.
      - name: ShellCheck (severity warning) over tracked shell scripts
        run: shellcheck --severity=warning $(git ls-files '*.sh')

      - name: bash -n syntax check over tracked shell scripts
        run: |
          set -u
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || fail=1
          done < <(git ls-files -z '*.sh')
          exit "$fail"

  test:
    name: Campaign scaffolder tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # --ignore-scripts: nothing in this tree needs a dependency lifecycle script to run,
      # and this repo is public, so a runner should not execute one. c8 has no postinstall.
      - run: npm ci --ignore-scripts
      - name: npm run test:coverage
        run: npm run test:coverage
